<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Echo video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p, iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div id="p"></div>
<script>
// Lettore YouTube per il pannello dell'Echo Show di casa.
// Il pannello (pagina locale di Home Assistant) incorpora questa pagina con #v=<id video>&t=<secondi> e la comanda con
// postMessage: {echoVideo:1, cmd:"play"|"pause"|"seek", t}. Questa pagina risponde con {echoVideo:1, ev:"ready"|"state"|"error"}.
// Il video è incorporato normalmente in una pagina pubblica: nessun dato di casa passa di qui.
(function () {
  "use strict";
  var h = new URLSearchParams(location.hash.slice(1));
  var id = h.get("v") || "";
  var start = Math.max(0, Math.floor(+h.get("t") || 0));
  var player = null, ready = false;
  var top = window.parent !== window ? window.parent : null;

  function post(m) { if (top) { m.echoVideo = 1; top.postMessage(m, "*"); } }
  function state() {
    if (!ready) return;
    try { post({ ev: "state", s: player.getPlayerState(), t: player.getCurrentTime(), d: player.getDuration() }); } catch (e) { /* niente */ }
  }

  if (!/^[\w-]{6,20}$/.test(id)) { post({ ev: "error", code: 2 }); return; }

  window.addEventListener("message", function (e) {
    if (!top || e.source !== top || !e.data || e.data.echoVideo !== 1 || !ready) return;
    var m = e.data;
    try {
      if (m.cmd === "play") player.playVideo();
      else if (m.cmd === "pause") player.pauseVideo();
      else if (m.cmd === "seek" && isFinite(m.t)) player.seekTo(Math.max(0, +m.t), true);
    } catch (er) { /* lettore non pronto */ }
    state();
  });

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("p", {
      videoId: id, width: "100%", height: "100%", host: "https://www.youtube-nocookie.com",
      playerVars: { autoplay: 1, mute: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, playsinline: 1, rel: 0,
        cc_load_policy: 0, start: start, origin: location.origin },
      events: {
        onReady: function (e) { ready = true; try { e.target.mute(); e.target.playVideo(); } catch (er) { /* niente */ } post({ ev: "ready" }); state(); },
        onStateChange: state,
        onError: function (e) { post({ ev: "error", code: e.data }); }
      }
    });
    setInterval(state, 500);
  };
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
})();
</script>
</body>
</html>
